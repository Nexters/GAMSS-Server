# 로컬 개발용 MySQL. 실행: docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: gamss-mysql
    # 배포 환경과 같은 토큰 크기로 맞춘다 — 대화방 검색이 bigram 을 전제로 한다(V18).
    command: --ngram-token-size=2
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: gamss
      MYSQL_USER: gamss
      MYSQL_PASSWORD: gamss
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - gamss-mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  gamss-mysql-data:

<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>GAMSS</title>
    <!--
      공유 링크를 눌렀는데 앱이 없는 사람이 도착하는 페이지다.

      의존성을 두지 않는다 - 외부 폰트·CDN·JS 없이 이 파일 하나로 끝난다. 인스타 인앱 브라우저처럼
      환경이 제각각인 곳에서 열리고, nginx 가 정적으로 내려주는 파일이라 빌드 단계도 없다.

      User-Agent 로 스토어에 자동 리다이렉트하지 않는다. 인앱 브라우저에서는 앱이 깔려 있어도
      Universal Links·App Links 가 안 먹는 경우가 많아서, 이미 앱이 있는 사람까지 스토어로 튕긴다.
      두 버튼을 다 보여주고 고르게 한다.
    -->
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --fg: #1a1a1a;
            --muted: #6b6b6b;
            --border: #e0e0e0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141414;
                --fg: #f2f2f2;
                --muted: #a0a0a0;
                --border: #333333;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
            -webkit-text-size-adjust: 100%;
        }
        main { width: 100%; max-width: 320px; text-align: center; }
        h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
        p { margin: 0 0 32px; font-size: 15px; line-height: 1.6; color: var(--muted); }
        a {
            display: block;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: var(--fg);
        }
        a:active { opacity: 0.7; }
    </style>
</head>
<body>
    <main>
        <h1>GAMSS</h1>
        <p>하루의 감정을 기록하고<br>감정 카드로 남겨보세요.</p>
        <a href="https://apps.apple.com/app/id6799644564">App Store에서 받기</a>
        <a href="https://play.google.com/store/apps/details?id=com.gamss.android">Google Play에서 받기</a>
    </main>
</body>
</html>

# GAMSS 리버스 프록시 (dev·prod 공용)
#
# 인증서는 --cert-name gamss 로 발급해 dev/prod 모두 /etc/letsencrypt/live/gamss/ 경로를 쓴다.
# 각 서버는 자기 도메인(dev-api / api)만 바라보므로 server_name 은 _ 로 둔다.

# IP당 요청 레이트리밋(http 컨텍스트). 로그인 등 홍수로부터 단일 서버를 보호한다.
# auth 는 더 엄격히, 일반 API 는 완만히. 초과 요청은 429로 응답한다.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

# 응답 헤더의 nginx 버전을 숨긴다(알려진 취약점 버전 특정을 어렵게 함).
server_tokens off;

# ── 보안 응답 헤더 공통 주의사항 ────────────────────────────────────────────────
# 1. always 를 붙여야 4xx·5xx(401·429 등)에도 헤더가 함께 나간다.
# 2. nginx 의 add_header 는 하위 컨텍스트에서 add_header 를 하나라도 쓰면 상위 것을 전부
#    버린다. 아래 server 블록의 location 에 add_header 를 추가할 일이 생기면, 그 location 에
#    보안 헤더도 같이 다시 적어야 한다. 지금은 어느 location 도 add_header 를 쓰지 않는다.
# 3. HSTS 는 HTTPS 응답에만 붙인다(평문 HTTP 응답의 HSTS 는 브라우저가 무시한다).
# 4. HSTS max-age 는 300(5분)으로 시작한다 — 브라우저가 한 번 받으면 그 기간 동안 HTTPS 로만
#    접속하고, 인증서 문제가 생겨도 http 폴백이나 경고 무시가 불가능해 갇힌다. 서버가 max-age=0
#    으로 해제하려 해도 그 응답을 HTTPS 로 받을 수 있어야 하므로, 인증서가 깨지면 해제도 못 한다.
#    dev·prod 에서 문제없음을 확인하며 300 -> 86400 -> 604800 -> 31536000 순으로 올린다.
# ──────────────────────────────────────────────────────────────────────────────

# HTTP(80): ACME 챌린지만 처리하고 나머지는 HTTPS로 영구 리다이렉트한다.
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지. 갱신도 80으로 오므로 리다이렉트 없이 항상 서빙한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 9102: 앱 메트릭 전용(사설망). 모니터링 서버(192.168.0.63)의 Prometheus 가 15초마다 긁어간다.
#
# 앱 컨테이너는 여전히 127.0.0.1:8080 에만 바인딩돼 있고, 이 블록만 사설 IP 에 노출된다
# (compose 의 포트 바인딩 참고). 사설망이라도 API 전체를 열 이유는 없어서 /actuator/prometheus
# 하나만 통과시키고 나머지는 404 로 막는다. TLS·인증을 걸지 않는 이유는 스크레이프마다 인증서·토큰을
# 관리해야 하고, 이 포트가 열린 범위 자체를 보안그룹이 모니터링 서버 한 대로 제한하기 때문이다.
server {
    listen 9102;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 메트릭 응답은 캐시·색인 대상이 아니다.
    add_header X-Content-Type-Options "nosniff" always;

    location = /actuator/prometheus {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host $host;

        # 스크레이프 간격(15초) 안에 끝나야 한다. 늘어지면 타임아웃 나는 편이 낫다 —
        # 메트릭 응답을 기다리며 앱 스레드를 붙잡는 것이 더 나쁘다.
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }

    # MySQL 엔진 지표. exporter 컨테이너는 포트를 열지 않고 이 경로로만 나간다.
    location = /metrics/mysql {
        set $upstream_mysqld mysqld-exporter:9104;
        proxy_pass http://$upstream_mysqld/metrics;
        proxy_set_header Host $host;

        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }

    location / {
        return 404;
    }
}

# HTTPS(443): 실제 서비스.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gamss/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamss/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 앱 컨테이너는 배포마다 IP가 바뀐다. Docker 내장 DNS를 resolver로 두고 변수로 넘겨 매번 다시 해석한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    # 보안 응답 헤더(파일 상단 주의사항 참고).
    # CSP 는 frame-ancestors 만 건다 — 이 블록은 스웨거 UI 도 서빙하는데, script/style 까지 제한하면
    # 스웨거가 깨진다. API 응답은 JSON 이라 나머지 지시어의 실익도 없다.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # actuator는 외부에 노출하지 않는다. 헬스체크는 서버 내부에서 직접 호출한다.
    location ^~ /actuator {
        return 404;
    }

    # 스웨거는 전체 API 명세를 노출하므로 Basic Auth로 보호한다(팀·클라만 비번으로 접근).
    location ~ ^/(swagger-ui|v3/api-docs) {
        auth_basic           "GAMSS API Docs";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 로그인·토큰 재발급은 홍수에 취약해 더 엄격히 제한한다.
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        set $upstream_app app:8080;
        # proxy_pass 에 변수를 쓰면 URI가 자동으로 붙지 않아 $request_uri 를 명시한다.
        proxy_pass http://$upstream_app$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 호출은 응답까지 수십 초가 걸릴 수 있어 기본값(60초)으로는 부족하다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

# HTTPS(443): 백오피스 (admin.gamss.kr / dev-admin.gamss.kr).
# 각 서버는 자기 admin 호스트만 수신하므로 두 이름을 함께 둬도 안전하다.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.gamss.kr dev-admin.gamss.kr;

    # 기존 gamss 인증서를 재사용한다(발급 시 admin 도메인을 SAN에 추가). 파일이 이미 있어
    # 인증서 확장 전에도 nginx는 기동한다(도메인 불일치 경고만, 확장·reload 후 해소).
    ssl_certificate     /etc/letsencrypt/live/gamss/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamss/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10m;

    # 보안 응답 헤더(파일 상단 주의사항 참고).
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 전체 CSP. dev 에서 Report-Only 로 먼저 내보내 로그인·로그아웃·전 화면 순회로 위반이
    # 0건임을 확인한 뒤 차단 모드로 승격했다. 각 출처의 근거는 다음과 같다.
    #   - script-src 의 apis.google.com : Firebase signInWithPopup 이 gapi 로더를 불러온다.
    #                                     검증 없이 걸었다면 관리자 로그인이 막혔을 지점이다
    #   - frame-src 의 firebaseapp.com  : dev·prod 가 같은 Firebase 프로젝트(gamss-cbdcb)라
    #                                     와일드카드 대신 정확한 origin 으로 고정했다
    #   - frame-ancestors 'none'        : 클릭재킹 차단. 백오피스에는 회원 강제 탈퇴·관리자
    #                                     추가/삭제·프롬프트 변경처럼 되돌리기 어려운 액션이 있어,
    #                                     로그인된 관리자를 iframe 으로 유인하는 공격을 막는다
    # admin-web 은 CDN·외부 폰트를 쓰지 않고 전부 Vite 번들이라 나머지는 self 기준이고,
    # style-src 의 unsafe-inline 은 React·Recharts 가 인라인 스타일을 주입하기 때문이다.
    #
    # 출처를 추가해야 할 일이 생기면, 추측으로 고치지 말고 Report-Only 로 되돌려
    # 실제 브라우저에서 위반을 수집한 뒤 반영한다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://gamss-cbdcb.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location ^~ /actuator {
        return 404;
    }

    # /api 는 앱으로. SPA와 같은 오리진이라 CORS 설정이 필요 없다.
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 그 외는 백오피스 정적 컨테이너로.
    location / {
        set $upstream_admin admin:80;
        proxy_pass http://$upstream_admin$request_uri;
        proxy_set_header Host $host;
    }
}

# HTTPS(443): 공유 링크 도메인 (gamss.kr).
#
# 인스타 스토리 공유 링크를 누른 사람이 도착하는 곳이다. 여기서 하는 일은 둘뿐이다 — OS 가
# 도메인 소유를 확인하는 검증 파일(apple-app-site-association·assetlinks.json)을 그대로 내려주고,
# 앱이 없는 사람에게 보여줄 정적 페이지를 서빙한다.
#
# 앱 컨테이너를 거치지 않는다. 배포·재시작·앱 장애와 무관하게 살아 있어야 하는 경로이고,
# 검증 파일이 한 번 실패하면 OS 가 한동안 다시 물어보지 않아 링크가 조용히 죽는다.
#
# API 블록의 limit_req 를 물려받지 않는다 — 공유가 퍼지면 유입이 몰리는데 정적 파일 응답이
# 429 로 막히면 링크 자체가 죽는다.
#
# 이 블록은 dev 서버에도 함께 올라가지만 gamss.kr 은 prod 만 가리키므로 도달하지 않는다.
server {
    listen 443 ssl;
    http2 on;
    server_name gamss.kr;

    ssl_certificate     /etc/letsencrypt/live/gamss/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamss/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 공유 카드 조회만 앱으로 프록시한다(아래 /api/cards/shared/). proxy_pass 에 변수를 쓰므로
    # 이름을 풀 resolver 가 필요하다 — 없으면 nginx 가 기동조차 하지 않는다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root  /var/www/gamss;
    index index.html;

    # 보안 응답 헤더(파일 상단 주의사항 참고).
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # iOS 는 확장자 없는 이 파일을 application/json 으로 받아야 검증한다(nginx 기본은
    # octet-stream). 리다이렉트가 끼어도 검증에 실패하므로 여기서 바로 응답한다.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # AASA 의 `paths` 는 **앱이 실제로 다루는 경로만** 적는다 — 지금은 공유 링크(`/c/*`) 하나뿐이다.
    # 예전처럼 `["*"]` 로 두면 이 도메인에 올리는 웹 페이지가 전부 앱으로 끌려가, 앱을 깐 사람은
    # 브라우저에서 열 수 없다 — 스토어 심사에 필요한 개인정보처리방침·이용약관이 대표적이다.
    # 웹이 기본이고 앱이 가져갈 경로만 예외로 두는 편이 새 페이지를 올릴 때마다 안전하다.
    #
    # 루트(`/`)는 일부러 넣지 않는다. 랜딩은 홍보·설치 안내용이라 앱이 있든 없든 브라우저에서
    # 보여야 한다 — 넣으면 앱을 깐 사람은 gamss.kr 을 눌러도 앱이 열려 랜딩을 볼 수 없다.
    #
    # 안드로이드는 이 파일과 무관하다. assetlinks.json 에는 경로 개념이 없어 도메인 전체를 앱에
    # 맡기고, 어느 경로를 가져갈지는 앱 매니페스트의 intent-filter(`pathPrefix`)가 정한다 —
    # 서버에서 좁힐 수 없으므로 앱 쪽과 맞춰야 한다.
    #
    # 검증 파일은 랜딩과 분리해 둔다. 아래 location / 이 /index.html 로 폴백하므로
    # 이 블록이 없으면 **파일이 없는 검증 요청이 404 대신 200 text/html 로 나가고**, 안드로이드
    # 검증기는 JSON 자리에서 HTML 을 받아 실패한다 — 그 실패는 OS 가 한동안 들고 있어 링크가
    # 조용히 죽는다. 위 AASA 는 `=` 라 여기보다 먼저 잡히므로 그대로 남는다.
    # (파일 상단 주의사항: 이 블록에 add_header 를 넣으면 server 레벨 보안 헤더가 전부 날아간다.)
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # 공유 카드 조회만 앱으로 넘긴다. 랜딩과 같은 오리진이 되어 CORS 가 끼어들지 않는다.
    #
    # 이 블록만 앱 컨테이너를 탄다(위 주의사항의 예외). 앱이 죽어도 페이지 껍데기와 설치 안내는
    # 정적이라 그대로 뜨고, 카드 내용만 비어 "가져오지 못했어요" 로 안내된다 — 검증 파일과 랜딩이
    # 앱과 무관해야 한다는 성질은 그대로다.
    #
    # 발급(POST /api/cards/{cardId}/share)은 넘기지 않는다. 인증이 필요한 앱 전용 경로라
    # 이 도메인에 열어 둘 이유가 없다.
    location ^~ /api/cards/shared/ {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # 공유 링크(/c/{토큰}). 토큰은 무한히 많아 경로마다 파일을 만들 수 없으므로, 한 장(`c.html`)을
    # /c/ 아래 모든 경로에 내려주고 브라우저가 주소에서 토큰을 읽어 카드를 받아온다.
    #
    # 아래 `location /` 폴백에 맡기면 랜딩(`index.html`)이 나가 카드가 영영 안 보인다.
    location ^~ /c/ {
        try_files $uri /c.html;
    }

    # 어떤 경로로 들어와도 랜딩을 보여준다. 앱 검증 파일(AASA)이 `paths: ["*"]` 로 이 도메인의
    # 모든 경로를 앱 것이라고 선언하므로, 앱이 없는 사람이 그 경로로 들어왔을 때 맨 404 대신
    # 설치 안내를 봐야 앞뒤가 맞는다.
    #
    # 위 `^~ /.well-known/` 블록이 먼저 잡아서 검증 파일은 이 폴백을 타지 않는다 — 그게 없으면
    # 파일 없는 검증 요청이 404 가 아니라 200 text/html 로 나가고, 안드로이드 검증기가 JSON 자리에서
    # HTML 을 받아 실패한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# www 는 apex 로 넘긴다. Universal Links 는 호스트를 정확히 매칭해서 www.gamss.kr 로 들어온
# 링크로는 앱이 열리지 않는다. DNS 에 www 레코드가 없으면 이 블록에는 아무도 도달하지 않는다.
server {
    listen 443 ssl;
    http2 on;
    server_name www.gamss.kr;

    ssl_certificate     /etc/letsencrypt/live/gamss/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamss/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 리다이렉트 응답에도 HSTS 를 실어야 이 호스트에도 정책이 걸린다(always 라 3xx 에도 붙는다).
    # 나머지 보안 헤더는 본문 없는 301 에 의미가 없어 넣지 않는다.
    add_header Strict-Transport-Security "max-age=300" always;

    return 301 https://gamss.kr$request_uri;
}

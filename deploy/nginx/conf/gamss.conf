# GAMSS 리버스 프록시 (dev·prod 공용)
#
# 인증서는 --cert-name gamss 로 발급해 dev/prod 모두 /etc/letsencrypt/live/gamss/ 경로를 쓴다.
# 각 서버는 자기 도메인(dev-api / api)만 바라보므로 server_name 은 _ 로 둔다.

# HTTP(80): ACME 챌린지만 처리하고 나머지는 HTTPS로 영구 리다이렉트한다.
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지. 갱신도 80으로 오므로 리다이렉트 없이 항상 서빙한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443): 실제 서비스.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gamss/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamss/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 앱 컨테이너는 배포마다 IP가 바뀐다. Docker 내장 DNS를 resolver로 두고 변수로 넘겨 매번 다시 해석한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    # actuator는 외부에 노출하지 않는다. 헬스체크는 서버 내부에서 직접 호출한다.
    location ^~ /actuator {
        return 404;
    }

    location / {
        set $upstream_app app:8080;
        # proxy_pass 에 변수를 쓰면 URI가 자동으로 붙지 않아 $request_uri 를 명시한다.
        proxy_pass http://$upstream_app$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 호출은 응답까지 수십 초가 걸릴 수 있어 기본값(60초)으로는 부족하다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

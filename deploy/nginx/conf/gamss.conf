# GAMSS 리버스 프록시 (dev·prod 공용)
#
# 도메인이 정해지면 server_name 을 채우고 443 서버 블록을 추가한다.
# 지금은 공인 IP로 직접 접근하는 단계라 모든 호스트를 받는다.
server {
    listen 80;
    server_name _;

    # 앱 컨테이너는 배포마다 재생성되면서 IP가 바뀐다. proxy_pass 에 이름을 그대로 쓰면
    # nginx가 기동 시점의 IP를 캐시해 버려서 재배포 후 502가 난다.
    # Docker 내장 DNS를 resolver로 두고 변수로 넘겨 매번 다시 해석하게 한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    # actuator는 외부에 노출하지 않는다. 헬스체크는 서버 내부에서 직접 호출한다.
    location ^~ /actuator {
        return 404;
    }

    location / {
        set $upstream_app app:8080;
        # proxy_pass 에 변수를 쓰면 URI가 자동으로 붙지 않아 $request_uri 를 명시한다.
        proxy_pass http://$upstream_app$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 호출은 응답까지 수십 초가 걸릴 수 있어 기본값(60초)으로는 부족하다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

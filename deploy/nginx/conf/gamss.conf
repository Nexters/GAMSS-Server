# GAMSS 리버스 프록시 (dev·prod 공용)
#
# 인증서는 --cert-name gamss 로 발급해 dev/prod 모두 /etc/letsencrypt/live/gamss/ 경로를 쓴다.
# 각 서버는 자기 도메인(dev-api / api)만 바라보므로 server_name 은 _ 로 둔다.

# IP당 요청 레이트리밋(http 컨텍스트). 로그인 등 홍수로부터 단일 서버를 보호한다.
# auth 는 더 엄격히, 일반 API 는 완만히. 초과 요청은 429로 응답한다.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

# 응답 헤더의 nginx 버전을 숨긴다(알려진 취약점 버전 특정을 어렵게 함).
server_tokens off;

# ── 보안 응답 헤더 공통 주의사항 ────────────────────────────────────────────────
# 1. always 를 붙여야 4xx·5xx(401·429 등)에도 헤더가 함께 나간다.
# 2. nginx 의 add_header 는 하위 컨텍스트에서 add_header 를 하나라도 쓰면 상위 것을 전부
#    버린다. 아래 server 블록의 location 에 add_header 를 추가할 일이 생기면, 그 location 에
#    보안 헤더도 같이 다시 적어야 한다. 지금은 어느 location 도 add_header 를 쓰지 않는다.
# 3. HSTS 는 HTTPS 응답에만 붙인다(평문 HTTP 응답의 HSTS 는 브라우저가 무시한다).
# 4. HSTS max-age 는 300(5분)으로 시작한다 — 브라우저가 한 번 받으면 그 기간 동안 HTTPS 로만
#    접속하고, 인증서 문제가 생겨도 http 폴백이나 경고 무시가 불가능해 갇힌다. 서버가 max-age=0
#    으로 해제하려 해도 그 응답을 HTTPS 로 받을 수 있어야 하므로, 인증서가 깨지면 해제도 못 한다.
#    dev·prod 에서 문제없음을 확인하며 300 -> 86400 -> 604800 -> 31536000 순으로 올린다.
# ──────────────────────────────────────────────────────────────────────────────

# HTTP(80): ACME 챌린지만 처리하고 나머지는 HTTPS로 영구 리다이렉트한다.
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지. 갱신도 80으로 오므로 리다이렉트 없이 항상 서빙한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443): 실제 서비스.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gamss/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamss/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 앱 컨테이너는 배포마다 IP가 바뀐다. Docker 내장 DNS를 resolver로 두고 변수로 넘겨 매번 다시 해석한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    # 보안 응답 헤더(파일 상단 주의사항 참고).
    # CSP 는 frame-ancestors 만 건다 — 이 블록은 스웨거 UI 도 서빙하는데, script/style 까지 제한하면
    # 스웨거가 깨진다. API 응답은 JSON 이라 나머지 지시어의 실익도 없다.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # actuator는 외부에 노출하지 않는다. 헬스체크는 서버 내부에서 직접 호출한다.
    location ^~ /actuator {
        return 404;
    }

    # 스웨거는 전체 API 명세를 노출하므로 Basic Auth로 보호한다(팀·클라만 비번으로 접근).
    location ~ ^/(swagger-ui|v3/api-docs) {
        auth_basic           "GAMSS API Docs";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 로그인·토큰 재발급은 홍수에 취약해 더 엄격히 제한한다.
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        set $upstream_app app:8080;
        # proxy_pass 에 변수를 쓰면 URI가 자동으로 붙지 않아 $request_uri 를 명시한다.
        proxy_pass http://$upstream_app$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 호출은 응답까지 수십 초가 걸릴 수 있어 기본값(60초)으로는 부족하다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

# HTTPS(443): 백오피스 (admin.gamss.kr / dev-admin.gamss.kr).
# 각 서버는 자기 admin 호스트만 수신하므로 두 이름을 함께 둬도 안전하다.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.gamss.kr dev-admin.gamss.kr;

    # 기존 gamss 인증서를 재사용한다(발급 시 admin 도메인을 SAN에 추가). 파일이 이미 있어
    # 인증서 확장 전에도 nginx는 기동한다(도메인 불일치 경고만, 확장·reload 후 해소).
    ssl_certificate     /etc/letsencrypt/live/gamss/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamss/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10m;

    # 보안 응답 헤더(파일 상단 주의사항 참고).
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 전체 CSP. dev 에서 Report-Only 로 먼저 내보내 로그인·로그아웃·전 화면 순회로 위반이
    # 0건임을 확인한 뒤 차단 모드로 승격했다. 각 출처의 근거는 다음과 같다.
    #   - script-src 의 apis.google.com : Firebase signInWithPopup 이 gapi 로더를 불러온다.
    #                                     검증 없이 걸었다면 관리자 로그인이 막혔을 지점이다
    #   - frame-src 의 firebaseapp.com  : dev·prod 가 같은 Firebase 프로젝트(gamss-cbdcb)라
    #                                     와일드카드 대신 정확한 origin 으로 고정했다
    #   - frame-ancestors 'none'        : 클릭재킹 차단. 백오피스에는 회원 강제 탈퇴·관리자
    #                                     추가/삭제·프롬프트 변경처럼 되돌리기 어려운 액션이 있어,
    #                                     로그인된 관리자를 iframe 으로 유인하는 공격을 막는다
    # admin-web 은 CDN·외부 폰트를 쓰지 않고 전부 Vite 번들이라 나머지는 self 기준이고,
    # style-src 의 unsafe-inline 은 React·Recharts 가 인라인 스타일을 주입하기 때문이다.
    #
    # 출처를 추가해야 할 일이 생기면, 추측으로 고치지 말고 Report-Only 로 되돌려
    # 실제 브라우저에서 위반을 수집한 뒤 반영한다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://gamss-cbdcb.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location ^~ /actuator {
        return 404;
    }

    # /api 는 앱으로. SPA와 같은 오리진이라 CORS 설정이 필요 없다.
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 그 외는 백오피스 정적 컨테이너로.
    location / {
        set $upstream_admin admin:80;
        proxy_pass http://$upstream_admin$request_uri;
        proxy_set_header Host $host;
    }
}

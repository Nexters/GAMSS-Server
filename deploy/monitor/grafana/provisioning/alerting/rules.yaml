                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        80
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ]
              }
            }

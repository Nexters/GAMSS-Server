                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "gamss-llm-failure",
          "title": "LLM 생성 실패율 급증",
          "condition": "C",
          "for": "10m",
          "isPaused": false,
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.env }} LLM 생성 실패율 {{ humanize $values.B.Value }}%",
            "description": "재시도까지 소진한 최종 실패가 10분 넘게 20% 를 넘었다. Gemini 장애·프롬프트 변경·토큰 상한을 의심한다."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum by (env) (rate(gamss_llm_generation_seconds_count{success=\"false\"}[10m])) / clamp_min(sum by (env) (rate(gamss_llm_generation_seconds_count[10m])), 0.0001) * 100",
                "instant": false,
                "range": true,
                "editorMode": "code",
                "intervalMs": 60000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",

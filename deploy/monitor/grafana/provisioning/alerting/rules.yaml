# 알림 규칙(프로비저닝). UI 에서 만든 규칙과 달리 파일이 단일 출처다.
#
# 각 규칙은 Prometheus 쿼리(A) → 마지막 값 축약(B) → 임계치 판정(C) 세 단계로 구성된다. for 는 '그 상태가 이만큼
# 지속돼야 발화'라는 뜻이라, 순간적으로 튄 값에는 알림이 가지 않는다.
#
# noDataState 는 '앱 다운'만 Alerting 이다 — 다른 규칙에서 데이터가 없는 것은 대개 트래픽이
# 없다는 뜻이지만(정상), 스크레이프 자체가 끊긴 것은 그 자체로 사고다.
#
# 이 파일은 YAML 이 JSON 의 상위집합이라는 점을 이용해 JSON 문법으로 쓰여 있다(생성물).
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "gamss",
      "folder": "GAMSS 알림",
      "interval": "1m",
      "rules": [
        {
          "uid": "gamss-app-down",
          "title": "앱 다운",
          "condition": "C",
          "for": "2m",
          "isPaused": false,
          "noDataState": "Alerting",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.env }} 앱이 응답하지 않는다",
            "description": "Prometheus 가 {{ $labels.env }} 의 /actuator/prometheus 를 2분 넘게 긁지 못했다. 앱이 죽었거나, nginx 내부 블록(9102)·보안그룹이 막힌 상태다."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "up{job=\"spring\"}",
                "instant": false,
                "range": true,
                "editorMode": "code",
                "intervalMs": 60000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "gamss-http-5xx",
          "title": "5xx 급증",
          "condition": "C",
          "for": "5m",
          "isPaused": false,
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.env }} 5xx 비율 {{ humanize $values.B.Value }}%",
            "description": "서버 오류 응답이 5분 넘게 5% 를 넘었다. 서비스 개요 대시보드의 '요청률(결과별)'과 '최근 ERROR 로그'를 같은 시각으로 맞춰 본다. 표본이 20건 미만인 구간은 제외한다 — 새벽에 몇 건 중 몇 건이 실패한 것을 '급증'으로 알리면, 정작 트래픽이 많을 때의 알림까지 함께 무시하게 된다."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "(sum by (env) (rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) / clamp_min(sum by (env) (rate(http_server_requests_seconds_count[5m])), 0.001) * 100) and (sum by (env) (increase(http_server_requests_seconds_count[5m])) >= 20)",
                "instant": false,
                "range": true,
                "editorMode": "code",
                "intervalMs": 60000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        5
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ]
              }
            }
          ]
        },
        {

        {
          "uid": "gamss-memory",
          "title": "메모리 여유 부족",
          "condition": "C",
          "for": "10m",
          "isPaused": false,
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.server }} 메모리 여유 {{ humanize $values.B.Value }}%",
            "description": "가용 메모리가 10% 아래로 10분 이상 머물렀다. OOM 으로 컨테이너가 죽기 직전일 수 있다."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100",
                "instant": false,
                "range": true,
                "editorMode": "code",
                "intervalMs": 60000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "settings": {

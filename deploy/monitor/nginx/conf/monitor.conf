# monitor.gamss.kr 리버스 프록시 (Grafana 전용).
#
# 인증서는 --cert-name monitor 로 발급해 /etc/letsencrypt/live/monitor/ 를 쓴다
# (dev·prod 의 gamss 인증서와 서버가 달라 공유하지 않는다).

server_tokens off;

# 웹소켓 업그레이드 요청에만 Connection: upgrade 를 넘긴다. 모든 요청에 upgrade 를 실으면
# 일반 HTTP 요청까지 업그레이드 협상 대상이 돼 upstream 연결을 재사용하지 못한다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP(80): ACME 챌린지만 처리하고 나머지는 HTTPS로 영구 리다이렉트한다.
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지. 갱신도 80으로 오므로 리다이렉트 없이 항상 서빙한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443): Grafana.
server {
    listen 443 ssl;
    http2 on;
    server_name monitor.gamss.kr;

    ssl_certificate     /etc/letsencrypt/live/monitor/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 컨테이너 IP 가 재기동마다 바뀌므로 도커 내장 DNS 를 resolver 로 두고 변수로 넘겨 매번 다시 해석한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 대시보드 JSON 임포트 정도가 최대치라 기본값(1m)보다만 조금 키운다.
    client_max_body_size 10m;

    # 보안 응답 헤더. gamss.conf 와 달리 CSP 는 frame-ancestors 만 건다 —
    # Grafana 는 자체 번들이 인라인 스크립트·스타일을 쓰고 CSP 를 앱 설정으로 관리한다.
    # 여기서 default-src 까지 조이면 대시보드가 통째로 하얗게 뜬다.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        set $upstream_grafana grafana:3000;
        # proxy_pass 에 변수를 쓰면 URI가 자동으로 붙지 않아 $request_uri 를 명시한다.
        proxy_pass http://$upstream_grafana$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live(대시보드 실시간 갱신)가 웹소켓을 쓴다. Upgrade 헤더를 넘기지 않으면
        # 패널이 갱신되지 않고 콘솔에 웹소켓 오류만 쌓인다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 넓은 시간범위 쿼리는 수십 초가 걸릴 수 있어 기본값(60초)으로는 부족하다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

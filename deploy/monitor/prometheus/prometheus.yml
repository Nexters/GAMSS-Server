# Prometheus 수집 설정.
#
# 타겟은 전부 같은 서브넷(192.168.0.0/24)의 사설 IP 다. 공인 IP 로 긁으면 트래픽이 인터넷을
# 돌고 exporter 를 외부에 열어야 하므로 반드시 사설 IP 를 쓴다.
#   gamss-dev  192.168.0.231
#   gamss-prod 192.168.0.141
#   (모니터링 서버 자신은 같은 compose 네트워크라 서비스명으로 붙는다)
#
# 포트 규약 — dev·prod 는 세 포트를 사설 IP 에만 바인딩해 노출한다:
#   9100 node_exporter (호스트 리소스)
#   9101 cAdvisor      (컨테이너별 리소스, 컨테이너 안에서는 8080)
#   9102 앱 메트릭     (nginx 내부 전용 블록 → app:8080/actuator/prometheus)
#
# 모든 타겟에 env 라벨(dev/prod/monitor)을 붙인다. Grafana 대시보드는 이 라벨을 변수로 받아
# 대시보드 하나로 환경을 전환한다(환경마다 대시보드를 복제하면 수정이 두 배가 된다).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { env: monitor, server: gamss-monitor }

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { env: monitor, server: gamss-monitor }
      - targets: ["192.168.0.231:9100"]
        labels: { env: dev, server: gamss-dev }
      - targets: ["192.168.0.141:9100"]
        labels: { env: prod, server: gamss-prod }

  - job_name: cadvisor
    static_configs:
      - targets: ["192.168.0.231:9101"]
        labels: { env: dev, server: gamss-dev }
      - targets: ["192.168.0.141:9101"]
        labels: { env: prod, server: gamss-prod }

  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["192.168.0.231:9102"]
        labels: { env: dev, server: gamss-dev }
      - targets: ["192.168.0.141:9102"]
        labels: { env: prod, server: gamss-prod }

  # 관측 도구 자신의 상태. Loki 가 rate limit(ingestion_rate_mb)으로 로그를 버리는 중인지,
  # compactor 의 보존 삭제가 실패하고 있는지는 여기서만 보인다 — 대시보드에는 그저
  # '로그가 적다'로만 나타나 원인을 짚을 수 없다. 같은 compose 네트워크라 서비스명으로 붙는다.
  - job_name: monitor-stack
    static_configs:
      - targets: ["loki:3100"]
        labels: { env: monitor, server: gamss-monitor, component: loki }
      - targets: ["grafana:3000"]
        labels: { env: monitor, server: gamss-monitor, component: grafana }

  # 외부 관점 프로브. blackbox_exporter 가 각 도메인에 실제로 HTTPS 요청을 보내고,
  # 그 결과(도달 여부·응답 시간·인증서 만료 시각)를 메트릭으로 돌려준다.
  # 60초 간격이면 충분하다 — 인증서는 하루 단위로 움직이고, 도달성은 앱 스크레이프가 더 촘촘하다.
  - job_name: blackbox
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [https_check]
    static_configs:
      - targets: ["https://api.gamss.kr", "https://admin.gamss.kr"]
        labels: { env: prod }
      - targets: ["https://dev-api.gamss.kr", "https://dev-admin.gamss.kr"]
        labels: { env: dev }
      - targets: ["https://monitor.gamss.kr"]
        labels: { env: monitor }
    relabel_configs:
      # 프로브는 '대상 URL 을 파라미터로 받는 exporter' 를 긁는 구조다. 그래서 타겟 주소를
      # __param_target 으로 옮기고, 실제 스크레이프 주소는 exporter 자신으로 바꾼다.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # MySQL 엔진 상태. 앱 포트를 열지 않는 원칙 그대로, dev·prod 의 nginx 내부 블록(9102)이
  # /metrics/mysql 로 프록시한다 — 보안그룹에 포트를 추가하지 않아도 된다.
  - job_name: mysql
    metrics_path: /metrics/mysql
    static_configs:
      - targets: ["192.168.0.231:9102"]
        labels: { env: dev, server: gamss-dev }
      - targets: ["192.168.0.141:9102"]
        labels: { env: prod, server: gamss-prod }

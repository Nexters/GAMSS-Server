# GAMSS dev 서버용 (app + MySQL, 한 서버)
# 필요한 환경변수는 같은 디렉토리 .env 에 정의한다(CD가 GitHub Secrets로 생성):
#   DB_PASSWORD, DB_ROOT_PASSWORD, JWT_SECRET, IMAGE_TAG
#
# 튜닝은 8GB 서버(가비아 Standard 2vCore/8GB) 기준으로 배분했다:
#   app 힙 3G + 비힙 약 0.8G / MySQL 약 2.5G / OS·Docker 약 0.5G → 여유 약 1.2G
# 여유분은 스레드 스택용이다. LLM 호출은 응답까지 스레드를 붙잡고 있어서
# 동시성을 올리려면 스레드를 늘려야 하고, 스레드당 스택이 1MB씩 붙는다.
# 컨테이너 로그 로테이션. 기본 json-file 드라이버는 무제한 적재라 디스크가 차면
# MySQL 쓰기 실패로 서비스 전체가 내려간다. 서비스당 최대 30MB(10MB×3)로 상한.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ghcr.io/nexters/gamss-server:${IMAGE_TAG:-dev}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://db:3306/gamss
      DB_USERNAME: gamss
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 감정 캐릭터 댓글·카드 생성용 Gemini API 키.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # 백오피스 접근 허용 이메일(쉼표 구분). 구글 로그인 후 이 목록에 있어야 관리자 토큰 발급.
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      JAVA_OPTS: -Xms1g -Xmx3g
    ports:
      # 루프백에만 바인딩 → 외부 비공개. 배포 스크립트의 헬스체크용이다.
      # nginx는 이 포트가 아니라 gamss 네트워크로 app:8080 에 직접 붙는다.
      - "127.0.0.1:8080:8080"
    networks: [gamss]

  # 백오피스 정적 SPA(admin-web). 포트 미노출 → 앞단 nginx(admin.gamss.kr)만 접근.
  admin:
    image: ghcr.io/nexters/gamss-server-admin:${IMAGE_TAG:-dev}
    restart: unless-stopped
    logging: *default-logging
    networks: [gamss]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on: [app, admin]
    ports:
      - "80:80"
      - "443:443"
      # 앱 메트릭 전용(내부). 앱 포트를 사설망에 여는 대신 nginx 가 /actuator/prometheus 하나만
      # 프록시한다 — 사설망이라도 API 전체를 노출할 이유는 없다.
      - "${PRIVATE_IP:-127.0.0.1}:9102:9102"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    # 갱신된 인증서를 주기적으로 반영한다(무중단 reload). 배포 시에도 reload 되지만 90일 갱신 주기 대비.
    command: sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    networks: [gamss]

  # HTTPS 인증서 발급·자동 갱신. 최초 발급은 서버에서 수동 1회, 이후 12시간마다 갱신 시도.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    networks: [gamss]

  # ── 모니터링 수집 에이전트 ─────────────────────────────────────────────────────
  # 세 컨테이너 모두 포트를 **사설 IP 에만** 연다. 가비아 보안그룹에서도 모니터링 서버
  # (192.168.0.63)만 허용해 이중으로 막는다. 도커의 포트 publish 는 ufw 를 우회하므로
  # (DOCKER-USER 체인이 먼저 평가된다) 바인딩 주소가 호스트단의 사실상 유일한 방어선이다.
  # PRIVATE_IP 는 배포 스크립트가 .env 에 써 넣는다 — 비어 있으면 127.0.0.1 로 떨어져
  # 수집이 안 될 뿐 외부로 열리지는 않는다(안전한 실패 방향).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${PRIVATE_IP:-127.0.0.1}:9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    logging: *default-logging
    command:
      # 기본 1초 주기는 CPU 를 상시로 갉는다. 스크레이프가 15초라 30초로도 해상도가 충분하다.
      - --housekeeping_interval=30s
      # 쓰지 않는 수집기를 꺼 메모리·CPU 를 아낀다(특히 percpu 는 코어 수만큼 시계열이 늘어난다).
      - --disable_metrics=percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      # 컨테이너 안에서는 8080 이라, 앱 포트와 겹치지 않게 호스트에서 9101 로 옮긴다.
      - "${PRIVATE_IP:-127.0.0.1}:9101:8080"

  # 컨테이너 로그를 Loki 로 push 한다. 긁어가는 방식이면 앱 서버에 수집 포트를 하나 더 열어야 하는데,
  # 보내는 쪽이 밀면 인바운드를 늘리지 않아도 된다.
  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/promtail/promtail.yml -config.expand-env=true
    environment:
      # env 라벨의 출처. dev·prod 가 같은 설정 파일을 쓰고 이 값만 다르다.
      ENV_NAME: dev
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # 도커 API 로 컨테이너 로그를 읽는다. 소켓을 넘기는 것은 사실상 호스트 root 를 주는 것과 같지만,
      # 대안인 Loki 로그 드라이버는 `docker logs` 를 못 쓰게 만들어 정작 장애 때 대응이 나빠진다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/promtail

  db:
    image: mysql:8.0
    restart: unless-stopped
    logging: *default-logging
    # ngram-token-size: 대화방 검색이 bigram 을 전제로 한다(V18 의 WITH PARSER ngram, 최소 2자 검증).
    # 기본값도 2 지만 기동 파라미터라 환경에 좌우되고, 바뀌면 풀텍스트 인덱스를 재생성해야 해서 고정한다.
    # (command 는 YAML folded scalar 라 블록 안에 주석을 넣으면 인자로 섞여 들어간다)
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=2G
      --ngram-token-size=2
    environment:
      MYSQL_DATABASE: gamss
      MYSQL_USER: gamss
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gamss]
    # 포트 미노출 → 외부 비공개(같은 네트워크의 app만 접속)

volumes:
  db-data:
  promtail-positions: # 어디까지 보냈는지 기록(재시작 후 중복 전송 방지)
  certbot-www: # ACME HTTP-01 챌린지 웹루트 (certbot 작성 → nginx 서빙)
  certbot-conf: # 발급된 인증서(/etc/letsencrypt). SCP로 안 지워지는 영속 볼륨.

networks:
  gamss:

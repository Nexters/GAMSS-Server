name: ✨ Feature
description: 새로운 기능을 제안합니다
title: "[Feature] "
labels: ["💡 feat"]
body:
  - type: markdown
    attributes:
      value: |
        기능 제안을 작성해주세요. 맥락이 분명할수록 논의와 리뷰가 빨라집니다.

  - type: textarea
    id: context
    attributes:
      label: 어떤 이슈인가요?
      description: 컨텍스트 / 배경을 설명합니다. (이 기능이 왜 필요한지, 어떤 상황에서 파생되었는지)
      placeholder: 예) 로그인 기능에서 인증 상태 유지 중 에러가 발생하여 세션 관리 기능이 필요해졌습니다.
    validations:
      required: true

  - type: textarea
    id: why-now
    attributes:
      label: 🎯 왜 지금 이걸 하는가
      description: 지금 구현해야 하는 이유. (비즈니스 요구, 다른 기능의 사전 조건, ADR 결정 이행 등)
      placeholder: 예) ADR-0011 멀티모듈 전환의 사전 조건 / 다음 스프린트 기능 X의 의존성
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ 성공 기준
      description: 기능이 완료되었음을 검증할 수 있는 조건을 체크리스트로 작성합니다.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 - 긴급
        - P1 - 높음
        - P2 - 보통
        - P3 - 낮음
      default: 2
    validations:
      required: true

  - type: input
    id: due-dev
    attributes:
      label: 작업 마감일
      placeholder: "YYYY-MM-DD (예: 2025-07-15까지 개발 완료 필요)"

  - type: input
    id: due-pr
    attributes:
      label: PR 마감일 (코드 리뷰 및 머지)
      placeholder: "YYYY-MM-DD (예: 2025-07-17까지 PR 머지 완료 예정)"

  - type: textarea
    id: related
    attributes:
      label: 연관 이슈
      description: 상위 / 하위 이슈를 적습니다. 없으면 생략합니다.
      placeholder: |
        상위 이슈: #
        하위 이슈: #

  - type: textarea
    id: todo
    attributes:
      label: 🔧 TODO
      value: |
        - [ ]

name: 🧹 Chore
description: 빌드 · 설정 · CI 등 소스 로직과 무관한 작업
title: "[chore] "
labels: ["⚙️ chore"]
body:
  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      description: 무엇을 하는 작업인지 적습니다.
      placeholder: 예) Gradle 의존성 버전 업데이트 (Spring Boot 4.1 → 4.2)
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 작업이 필요한 이유
      description: 배경 / 이유. (선택)
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ 완료 조건 (DoD)
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 - 긴급
        - P1 - 높음
        - P2 - 보통
        - P3 - 낮음
      default: 2
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 연관 이슈
      description: 상위 / 하위 / 관련 이슈 번호. 없으면 비워둡니다.
      placeholder: "예) 관련 #15"

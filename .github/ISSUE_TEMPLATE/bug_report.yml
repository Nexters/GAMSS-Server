name: 🐞 Bug Report
description: 버그를 제보합니다
title: "[fix] "
labels: ["🚨 fix"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 제보해주세요. 재현 절차가 구체적일수록 빠르게 고칠 수 있습니다.

  - type: textarea
    id: context
    attributes:
      label: 어떤 이슈인가요?
      description: 컨텍스트 / 배경을 설명합니다. (어떤 상황에서 생긴 버그인지)
      placeholder: 예) 로그인 기능에서 인증 상태 유지 중 에러가 발생하여 핫픽스 합니다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔁 재현 절차
      description: 버그를 재현하는 단계를 순서대로 작성합니다.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      placeholder: 정상적으로는 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      placeholder: 실제로는 어떻게 동작했나요? (에러 로그 / 스크린샷 첨부 가능)
    validations:
      required: true

  - type: textarea
    id: why-now
    attributes:
      label: 🎯 왜 지금 이걸 하는가
      description: 지금 처리해야 하는 이유. (사용자 이탈, 다른 기능의 사전 조건, SLA 위반 등)
      placeholder: 예) 세션 만료 버그로 DAU 5% 이탈 발생 중
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ 성공 기준
      description: 버그가 수정되었음을 검증할 수 있는 조건을 체크리스트로 작성합니다.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 - 긴급
        - P1 - 높음
        - P2 - 보통
        - P3 - 낮음
      default: 1
    validations:
      required: true

  - type: input
    id: due-dev
    attributes:
      label: 작업 마감일
      placeholder: "YYYY-MM-DD (예: 2025-07-15까지 수정 완료 필요)"

  - type: input
    id: due-pr
    attributes:
      label: PR 마감일 (코드 리뷰 및 머지)
      placeholder: "YYYY-MM-DD (예: 2025-07-17까지 PR 머지 완료 예정)"

  - type: textarea
    id: related
    attributes:
      label: 연관 이슈
      description: 상위 / 하위 이슈를 적습니다. 없으면 생략합니다.
      placeholder: |
        상위 이슈: #
        하위 이슈: #

  - type: textarea
    id: todo
    attributes:
      label: 🔧 TODO
      value: |
        - [ ]

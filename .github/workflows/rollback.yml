name: Rollback

# 배포는 성공했는데 버그가 발견돼 이전 버전으로 되돌려야 할 때 쓴다.
# (헬스체크 실패로 인한 롤백은 deploy-app.sh 가 배포 중에 자동으로 처리한다.)
#
# 되돌릴 태그는 GHCR 패키지 목록이나 이전 배포의 Actions 요약에서 확인할 수 있다.
# 서버에 이미 있는 deploy-app.sh 를 그대로 재사용하므로 헬스체크·자동복구도 동일하게 동작한다.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "배포 환경"
        required: true
        type: choice
        options: [dev, prod]
      image_tag:
        description: "되돌릴 이미지 태그 (예: dev-a1b2c3d)"
        required: true
        type: string

concurrency:
  # 같은 환경에 배포와 롤백이 동시에 돌면 .env 의 IMAGE_TAG 가 꼬인다.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate image tag
        env:
          ENV_NAME: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        # 태그는 {환경}-{커밋} 형식이다. prod 에 dev 이미지를 올리는 사고를 막는다.
        run: |
          if [[ "${IMAGE_TAG}" != "${ENV_NAME}-"* ]]; then
            echo "::error::이미지 태그 '${IMAGE_TAG}' 는 ${ENV_NAME} 환경용이 아닙니다. '${ENV_NAME}-' 로 시작해야 합니다."
            exit 1
          fi
          echo "${ENV_NAME} 환경으로 ${IMAGE_TAG} 롤백을 진행합니다."

      - name: Rollback
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            DEPLOY_DIR="${HOME}/app"
            trap "docker logout ghcr.io >/dev/null 2>&1 || true" EXIT

            if [ ! -x "${DEPLOY_DIR}/deploy-app.sh" ]; then
              echo "배포 스크립트가 없습니다: ${DEPLOY_DIR}/deploy-app.sh"
              echo "이 서버에 한 번도 배포된 적이 없으면 롤백할 대상도 없습니다."
              exit 1
            fi

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # 지정한 태그가 GHCR에 없으면 pull 이 실패하고 deploy-app.sh 가 .env 를 원복한다.
            "${DEPLOY_DIR}/deploy-app.sh" "${DEPLOY_DIR}" "${IMAGE_TAG}"

      - name: Rollback Summary
        if: always()
        run: |
          {
            echo "### 롤백 결과"
            echo ""
            echo "- **환경:** ${{ inputs.environment }}"
            echo "- **되돌린 태그:** ${{ inputs.image_tag }}"
            echo "- **실행자:** ${{ github.actor }}"
            echo "- **상태:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  # base 브랜치를 가리지 않는다. stacked PR(base 가 피처 브랜치)도 CI 를 받게 하려는 것이며,
  # 이때 검증되는 건 'head 를 그 base 에 머지한 상태' 라 dev 기준 통과를 뜻하지는 않는다.
  # dev 로 base 를 옮기면 그때 진짜 검증이 다시 돈다.
  pull_request:
  # dev·prod push 시에는 Build & Deploy 가 이 워크플로를 호출한다.
  # 여기에 push 트리거를 두면 테스트가 두 번 돌고, 무엇보다 배포와 병렬로 돌아서
  # 테스트가 깨져도 배포를 막지 못한다.
  workflow_call:

concurrency:
  # 같은 PR에 새 push가 오면 진행 중이던 이전 CI를 취소.
  # 그룹명에 github.workflow 를 쓰면 호출된 경우 caller 의 워크플로명이 잡혀
  # caller 와 그룹이 겹치므로, 고정 접두사를 쓴다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Test & Coverage
        run: ./gradlew build jacocoTestReport

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/test/*.xml
          check_name: "Test Results"

      - name: Report Coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Test Coverage"
          update-comment: true
          min-coverage-overall: 0
          min-coverage-changed-files: 0

  # 백오피스(admin-web) 린트·타입체크·빌드. 이게 없으면 프론트 타입 에러가
  # dev 머지 후 이미지 빌드(build-admin)에서야 드러나고, 그 시점엔 백엔드 배포가
  # 이미 진행 중이다. 경로 필터 없이 항상 돌린다 - 1분 남짓으로 저렴하고,
  # 조건부 스킵은 브랜치 보호 필수 체크와의 조합을 복잡하게 만든다.
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          # admin-web/Dockerfile(node:22-alpine)과 맞춘다.
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck & Build
        run: npm run build

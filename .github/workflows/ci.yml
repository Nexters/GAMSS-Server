name: CI

on:
  # base 브랜치를 가리지 않는다. stacked PR(base 가 피처 브랜치)도 CI 를 받게 하려는 것이며,
  # 이때 검증되는 건 'head 를 그 base 에 머지한 상태' 라 dev 기준 통과를 뜻하지는 않는다.
  # dev 로 base 를 옮기면 그때 진짜 검증이 다시 돈다.
  pull_request:
  # dev·prod push 시에는 Build & Deploy 가 이 워크플로를 호출한다.
  # 여기에 push 트리거를 두면 테스트가 두 번 돌고, 무엇보다 배포와 병렬로 돌아서
  # 테스트가 깨져도 배포를 막지 못한다.
  workflow_call:

concurrency:
  # 같은 PR에 새 push가 오면 진행 중이던 이전 CI를 취소.
  # 그룹명에 github.workflow 를 쓰면 호출된 경우 caller 의 워크플로명이 잡혀
  # caller 와 그룹이 겹치므로, 고정 접두사를 쓴다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 체크아웃은 GITHUB_TOKEN 을 로컬 git 설정에 남긴다. 빌드 도중 실행되는 남의 코드가
          # (npm 은 의존성의 lifecycle script 를 돌린다) 그것을 읽을 수 있다.
          # 어느 잡도 이후 git 인증을 쓰지 않으니 아예 남기지 않는다.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Test & Coverage
        run: ./gradlew build jacocoTestReport

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/test/*.xml
          check_name: "Test Results"

      - name: Report Coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Test Coverage"
          update-comment: true
          min-coverage-overall: 0
          min-coverage-changed-files: 0

  # 백오피스(admin-web) 린트·타입체크·빌드. 이게 없으면 프론트 타입 에러가
  # dev 머지 후 이미지 빌드(build-admin)에서야 드러난다. 그때는 백엔드 이미지만
  # GHCR에 올라간 채 deploy 가 통째로 막혀서, 백엔드만 고친 사람의 변경도 같이 묶인다.
  # 경로 필터 없이 항상 돌린다 - 1분 남짓으로 저렴하고,
  # 조건부 스킵은 브랜치 보호 필수 체크와의 조합을 복잡하게 만든다.
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 체크아웃은 GITHUB_TOKEN 을 로컬 git 설정에 남긴다. 빌드 도중 실행되는 남의 코드가
          # (npm 은 의존성의 lifecycle script 를 돌린다) 그것을 읽을 수 있다.
          # 어느 잡도 이후 git 인증을 쓰지 않으니 아예 남기지 않는다.
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          # admin-web/Dockerfile(node:22-alpine)과 맞춘다.
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck & Build
        run: npm run build

  # 랜딩(landing) 타입체크·빌드. admin-web 과 같은 이유로 항상 돌린다 —
  # 여기서 안 걸리면 타입 에러가 배포 단계에서야 드러나고, 그때는 다른 사람의 변경까지 함께 막힌다.
  #
  # 산출물(out/)은 여기서 만들지 않는다. 배포 잡이 서버에서 다시 빌드하는 것이 아니라,
  # image.yml 이 같은 커맨드로 만들어 nginx 디렉토리에 넣는다.
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 체크아웃은 GITHUB_TOKEN 을 로컬 git 설정에 남긴다. 빌드 도중 실행되는 남의 코드가
          # (npm 은 의존성의 lifecycle script 를 돌린다) 그것을 읽을 수 있다.
          # 어느 잡도 이후 git 인증을 쓰지 않으니 아예 남기지 않는다.
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & Build
        run: npm run build

name: Release

on:
  push:
    branches: [prod]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 모든 태그·히스토리 필요

      - name: Compute next version
        id: ver
        run: |
          # 기존 vX.Y.Z 태그 중 최신 버전
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          # 머지 커밋 메시지(= PR 제목 포함)로 bump 단계 결정
          MSG=$(git log -1 --pretty=%B)

          if [ -z "$LATEST" ]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            V=${LATEST#v}
            MAJOR=$(echo "$V" | cut -d. -f1)
            MINOR=$(echo "$V" | cut -d. -f2)
            PATCH=$(echo "$V" | cut -d. -f3)
          fi

          # #major → X+1, #minor → Y+1, 그 외 → Z+1 (기본 patch)
          if echo "$MSG" | grep -qiE '#major'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$MSG" | grep -qiE '#minor'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "이전 버전: ${LATEST:-(없음)} → 다음 버전: $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.next }}" \
            --target prod \
            --title "${{ steps.ver.outputs.next }}" \
            --generate-notes

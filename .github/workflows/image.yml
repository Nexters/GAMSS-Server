name: Build & Deploy

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  # rollback.yml 과 같은 그룹을 써서 한 환경에 배포·롤백이 겹치지 않게 한다.
  # 둘 다 서버 .env 의 IMAGE_TAG 를 고쳐서, 동시에 돌면 롤백 기준이 꼬인다.
  #
  # cancel-in-progress 는 false — SSH로 원격 상태를 바꾸는 중에 취소당하면
  # .env 만 갱신되고 컨테이너는 그대로인 어정쩡한 상태가 남는다.
  # 대기 중인 run 은 GitHub가 최신 것만 남기고 정리하므로 밀리지 않는다.
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  # 기본값은 최소 권한(read). GHCR push 가 필요한 build-backend·build-admin job 에만 write 를 부여한다.
  packages: read

jobs:
  # 테스트·린트가 통과해야 빌드·배포로 넘어간다.
  # 이미지 태그에 브랜치명을 쓰는데 Docker 태그는 슬래시를 허용하지 않으므로,
  # 배포 대상 브랜치가 아니면 여기서 멈춘다(이후 job은 needs 로 함께 skip).
  ci:
    if: github.ref_name == 'dev' || github.ref_name == 'prod'
    uses: ./.github/workflows/ci.yml
    # 워크플로 기본 권한에는 checks·pull-requests 가 없어 테스트 결과 게시가 실패한다.
    permissions:
      contents: read
      checks: write
      pull-requests: write

  # 이미지 이름·태그를 한 번만 계산해 빌드·배포 job 이 공유한다(단일 출처).
  # ci 와 병렬로 시작하지만, 빌드는 ci 통과까지 기다리므로(needs) 테스트 게이트는 유지된다.
  meta:
    if: github.ref_name == 'dev' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Compute image name and tag
        id: meta
        # 이미지 경로: GHCR은 소문자만 허용 (Nexters/GAMSS-Server → nexters/gamss-server)
        # 태그: 롤백하려면 커밋마다 고유해야 한다 (dev-a1b2c3d)
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # 백엔드 이미지. admin 빌드와 병렬로 돈다(서로 독립).
  # ci(테스트) 통과 후 빌드해야 테스트 안 된 이미지가 GHCR에 올라가 롤백 시 오배포되는 걸 막는다.
  build-backend:
    needs: [ci, meta]
    runs-on: ubuntu-latest
    # 이 job만 GHCR 에 push 하므로 write 를 여기서만 부여한다.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 고유 태그(배포·롤백 기준) + 브랜치 태그(최신 표식)
          tags: |
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.image }}:${{ github.ref_name }}
          # 백엔드·admin 캐시가 서로 덮어쓰지 않도록 scope 분리
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # 백오피스(admin-web) 정적 SPA 이미지. Firebase 웹 설정은 공개값이라 빌드 시 인라인한다.
  # (아직 미확보라 VITE_FIREBASE_* 는 비어 있고, 그동안 admin은 "설정 필요" 화면을 띄운다.)
  build-admin:
    needs: [ci, meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin
        uses: docker/build-push-action@v7
        with:
          context: ./admin-web
          push: true
          build-args: |
            VITE_API_BASE_URL=
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          tags: |
            ${{ needs.meta.outputs.image }}-admin:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.image }}-admin:${{ github.ref_name }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    needs: [meta, build-backend, build-admin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # dev 브랜치 → dev 환경, prod 브랜치 → prod 환경.
    # workflow_dispatch로 다른 브랜치에서 실행되는 것도 여기서 막힌다.
    if: github.ref_name == 'dev' || github.ref_name == 'prod'
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create .env
        # compose가 참조하는 시크릿만 채운다. IMAGE_TAG는 서버의 기존 값(롤백 기준)을
        # 보존해야 하므로 여기서 넣지 않고 배포 스크립트가 갱신한다.
        run: |
          cat > .env << 'EOF'
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          MYSQL_EXPORTER_PASSWORD=${{ secrets.MYSQL_EXPORTER_PASSWORD }}
          ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}
          EOF

      - name: Create nginx .htpasswd
        # 스웨거 Basic Auth 계정(user:해시)은 레포에 커밋하지 않고 시크릿(SWAGGER_HTPASSWD)에서
        # 이 위치에 생성한다 — 아래 SCP source·서버 복사 경로가 이 파일을 그대로 집어간다.
        # 해시에 '$'가 들어가므로 heredoc 대신 env + printf 로 그대로 기록한다.
        env:
          SWAGGER_HTPASSWD: ${{ secrets.SWAGGER_HTPASSWD }}
        run: |
          mkdir -p deploy/nginx/conf
          printf '%s\n' "$SWAGGER_HTPASSWD" > deploy/nginx/conf/.htpasswd

      - name: Transfer files via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy/${{ github.ref_name }}/docker-compose.yml,deploy/nginx/conf/gamss.conf,deploy/nginx/conf/.htpasswd,deploy/promtail/promtail.yml,.github/scripts/deploy-app.sh,.env"
          target: /tmp/gamss-deploy/

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ needs.meta.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: ENV_NAME,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            DEPLOY_DIR="${HOME}/app"
            TMP_DIR="/tmp/gamss-deploy"
            trap "rm -rf '${TMP_DIR}'; docker logout ghcr.io >/dev/null 2>&1 || true" EXIT

            mkdir -p "${DEPLOY_DIR}/nginx/conf" "${DEPLOY_DIR}/promtail"
            cp "${TMP_DIR}/deploy/${ENV_NAME}/docker-compose.yml" "${DEPLOY_DIR}/"
            cp "${TMP_DIR}/deploy/nginx/conf/gamss.conf" "${DEPLOY_DIR}/nginx/conf/"
            cp "${TMP_DIR}/deploy/nginx/conf/.htpasswd" "${DEPLOY_DIR}/nginx/conf/"
            cp "${TMP_DIR}/deploy/promtail/promtail.yml" "${DEPLOY_DIR}/promtail/"
            cp "${TMP_DIR}/.github/scripts/deploy-app.sh" "${DEPLOY_DIR}/"
            chmod +x "${DEPLOY_DIR}/deploy-app.sh"

            # 시크릿은 매번 덮어쓰되, 기존 IMAGE_TAG(롤백 기준)는 살려서 넘긴다
            NEW_ENV="${TMP_DIR}/.env"
            OLD_ENV="${DEPLOY_DIR}/.env"
            if [ -f "${OLD_ENV}" ]; then
              grep -E '^IMAGE_TAG=' "${OLD_ENV}" >> "${NEW_ENV}" || true
            fi
            cp "${NEW_ENV}" "${OLD_ENV}"
            chmod 600 "${OLD_ENV}"

            # GHCR 패키지는 기본 private — 수명 짧은 GITHUB_TOKEN으로 pull 권한만 얻는다
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            "${DEPLOY_DIR}/deploy-app.sh" "${DEPLOY_DIR}" "${IMAGE_TAG}"

      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "### 배포 결과"
            echo ""
            echo "- **환경:** ${{ github.ref_name }}"
            echo "- **이미지:** ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}"
            echo "- **커밋:** ${{ github.sha }}"
            echo "- **상태:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

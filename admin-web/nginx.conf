# admin-web 정적 서버 (컨테이너 내부 전용).
# /api 프록시·TLS·인증은 앞단 리버스 프록시(admin.gamss.kr server 블록)가 담당하고,
# 이 컨테이너는 빌드된 SPA 파일만 내보낸다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 해시가 붙은 정적 자산(index-<hash>.js 등)은 내용이 바뀌면 파일명도 바뀌므로 영구 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: 실제 파일이 없으면 index.html로 넘겨 클라이언트 라우터가 경로를 처리하게 한다.
    # (이게 없으면 /members/5 새로고침 시 404)
    location / {
        try_files $uri /index.html;
        # index.html은 캐시하지 않아야 새 배포가 즉시 반영된다.
        add_header Cache-Control "no-cache";
    }
}

# 백오피스(admin-web) 리버스 프록시 블록.
# 배포 인프라에 합칠 때 deploy/nginx/conf/gamss.conf 에 이 server 블록을 추가한다.
# dev 서버에서는 server_name 을 dev-admin.gamss.kr 로 바꾼다(이미지는 dev·prod 동일).
server {
    listen 80;
    server_name admin.gamss.kr;

    # 앱·admin 컨테이너는 재배포마다 IP가 바뀌므로 Docker 내장 DNS로 매번 다시 해석한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10m;

    # /api 는 앱으로. SPA와 같은 오리진이라 CORS 설정이 필요 없다.
    location /api/ {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # actuator 등 앱 내부 엔드포인트는 백오피스 호스트로 노출하지 않는다.
    location ^~ /actuator {
        return 404;
    }

    # 그 외 모든 경로는 정적 SPA 컨테이너로 넘긴다.
    location / {
        set $upstream_admin admin:80;
        proxy_pass http://$upstream_admin$request_uri;
        proxy_set_header Host $host;
    }
}

# ── 실제 관리자 인증(/api/admin + JWT)이 붙기 전까지 임시 차단 ─────────────
# 위 server 블록의 `location /` 안에 아래 두 줄을 넣어 Basic Auth 로 막는다.
# htpasswd 파일은 서버에서 생성: htpasswd -c /etc/nginx/conf.d/.admin_htpasswd <id>
#     auth_basic           "GAMSS Admin";
#     auth_basic_user_file /etc/nginx/conf.d/.admin_htpasswd;
# 또는 팀 사무실/VPN IP만 허용: allow <ip>;  deny all;

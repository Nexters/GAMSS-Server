spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gamss
    username: gamss
    password: gamss
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 로컬 전용: 검증 실패 시 자동 clean+재적용(LocalFlywayConfig)을 위해 clean을 허용한다.

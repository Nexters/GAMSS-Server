spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gamss
    username: gamss
    password: gamss
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 로컬 전용: 검증 실패 시 자동 clean+재적용(LocalFlywayConfig)을 위해 clean을 허용한다.
    # 배포(dev/prod) 프로필엔 이 설정이 없어 clean이 기본값(금지)이다.
    clean-disabled: false

jwt:
  secret: local-development-secret-change-me-to-a-long-random-value-0123456789

encryption:
  # 로컬 개발용 더미 키(Base64 32바이트). 실제 배포는 DATA_ENCRYPTION_KEY·SEARCH_INDEX_KEY
  # 환경변수로 주입한다(jwt.secret 과 같은 방식).
  #
  # 바꾸지 말 것 — 키가 바뀌면 로컬 DB에 이미 저장된 대화를 복호화할 수 없어 조회가 실패한다.
  # 두 키는 서로 달라야 하며, 같으면 부팅 단계에서 걸린다.
  data-key: Z2Ftc3MtbG9jYWwtZGV2ZWxvcG1lbnQtZGF0YS1rZXk=
  index-key: Z2Ftc3MtbG9jYWwtZGV2LXNlYXJjaC1pbmRleC1rZXk=

admin:
  # 로컬 개발용 관리자 허용목록. 실제 배포는 ADMIN_EMAILS 환경변수로 주입한다.
  emails: mj04300017@gmail.com

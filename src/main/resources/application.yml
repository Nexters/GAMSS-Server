spring:
  application:
    name: gamss
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_VALIDITY:PT1H}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:P14D}

firebase:
  # 소셜 로그인 검증 대상 Firebase 프로젝트. 비밀이 아니므로 설정값으로 둔다.
  project-id: gamss-cbdcb

admin:
  # 백오피스 접근 허용 이메일(쉼표 구분). 구글 로그인 후 이 목록에 있어야 관리자 토큰을 발급한다.
  emails: ${ADMIN_EMAILS:}

conversation:
  comment-pending-timeout: PT3M

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.1-flash-lite
  request-timeout: PT30S

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


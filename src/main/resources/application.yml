spring:
  application:
    name: gamss
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_VALIDITY:PT1H}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:P14D}

oauth:
  google:
    issuer: https://accounts.google.com
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    client-ids: ${GOOGLE_CLIENT_IDS:}
  apple:
    issuer: https://appleid.apple.com
    jwks-uri: https://appleid.apple.com/auth/keys
    client-ids: ${APPLE_CLIENT_IDS:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


spring:
  application:
    name: gamss
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_VALIDITY:PT1H}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:P14D}

firebase:
  # 소셜 로그인 검증 대상 Firebase 프로젝트. 비밀이 아니므로 설정값으로 둔다.
  project-id: gamss-cbdcb

admin:
  # 백오피스 접근 허용 이메일(쉼표 구분). 구글 로그인 후 이 목록에 있어야 관리자 토큰을 발급한다.
  emails: ${ADMIN_EMAILS:}

conversation:
  comment-pending-timeout: PT3M

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.1-flash-lite
  request-timeout: PT30S
  # 모델별 토큰 요금(USD, 100만 토큰당, 글로벌 기준). Gemini는 요금 API가 없어 문서 기준으로 둔다
  # (2026-07, ai.google.dev/gemini-api/docs/pricing). 캐시 입력은 할인가, 출력은 캐시 안 됨.
  # 새 모델을 쓰면 항목만 추가하면 비용 계산이 자동 반영된다. 키에 점(.)이 있어 [ ] 로 감싼다.
  pricing:
    models:
      "[gemini-3.1-flash-lite]": { input-per1m: 0.25, cached-input-per1m: 0.025, output-per1m: 1.50 }
      "[gemini-3.5-flash-lite]": { input-per1m: 0.30, cached-input-per1m: 0.03, output-per1m: 2.50 }
      "[gemini-3.5-flash]": { input-per1m: 1.50, cached-input-per1m: 0.15, output-per1m: 9.00 }
      "[gemini-3.6-flash]": { input-per1m: 1.50, cached-input-per1m: 0.15, output-per1m: 7.50 }

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


spring:
  application:
    name: gamss
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

# HTTPS 엣지(nginx) 뒤에서 X-Forwarded-Proto/Host 를 반영해 앱이 요청 스킴을 https 로 인식하게 한다.
# springdoc 이 문서·Try it out URL 을 http 가 아니라 https 로 생성하도록 하는 것이 목적.
# 앱 포트는 127.0.0.1 에만 바인딩돼 nginx만 접근하므로 이 헤더를 신뢰해도 안전하다(외부에서 위조 주입 불가).
server:
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      # 톰캣 스레드풀 메트릭(tomcat.threads.busy 등)은 MBean 등록이 켜져야 노출된다.
      # LLM 호출이 응답까지 요청 스레드를 붙잡는 구조라 스레드 포화가 곧 장애다 — 반드시 관측해야 한다.
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_VALIDITY:PT1H}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:P14D}

encryption:
  # 대화 텍스트 암호화 키(Base64 32바이트). 없으면 앱이 뜨지 않는다 — 평문 저장으로 조용히
  # 넘어가는 것보다 부팅 실패가 낫기 때문이다.
  data-key: ${DATA_ENCRYPTION_KEY}
  # 검색용 블라인드 인덱스 키. data-key 와 반드시 달라야 한다(같으면 부팅 실패) —
  # 인덱스가 새더라도 암호문은 열리지 않게 하려는 분리다.
  index-key: ${SEARCH_INDEX_KEY}

firebase:
  # 소셜 로그인 검증 대상 Firebase 프로젝트. 비밀이 아니므로 설정값으로 둔다.
  project-id: gamss-cbdcb

admin:
  # 백오피스 접근 허용 이메일(쉼표 구분). 구글 로그인 후 이 목록에 있어야 관리자 토큰을 발급한다.
  emails: ${ADMIN_EMAILS:}

gamss:
  build:
    # 배포 스크립트가 서버 .env 에 넣고 compose 가 컨테이너로 넘기는 이미지 태그.
    # 로컬·테스트에는 없으므로 unknown 으로 떨어진다(메트릭 라벨로만 쓰인다).
    image-tag: ${IMAGE_TAG:unknown}

conversation:
  pending-generation-timeout: PT3M

card:
  # 자동 종료·카드 생성 배치가 다루는 가장 이른 대화방 생성일(KST). 이 날 이전에 만들어진 방은
  # 요약이 없어(요약 저장이 이 기능부터 시작됐다) 카드는 못 만들고 종료만 되므로 아예 제외한다.
  # 배포일에 맞춰 조정한다 — 늦게 잡으면 그 사이 방들이 배치 대상에서 빠질 뿐이지만, 이르게 잡으면
  # 요약 없는 방들이 카드 없이 닫힌다.
  auto-card-start-date: 2026-08-15

  share:
    # 카드 공유 링크의 앞부분. 서버가 완성된 URL 을 내려주므로 앱이 도메인을 들고 있지 않아도 된다.
    #
    # dev·prod 가 같은 값을 쓴다. 링크를 누르면 앱이 열리고, 앱은 **자기가 보는 서버**에 토큰을
    # 물어보므로(GET /api/cards/shared/{token}) dev 빌드로 dev 에서 발급한 링크는 정상 동작한다.
    #
    # 다만 **앱이 없을 때의 웹 미리보기는 dev 에서 확인할 수 없다** — gamss.kr 은 prod 를 가리켜
    # prod DB 에 없는 토큰이 되어 404 로 떨어진다. 그 화면은 prod 배포 후에 확인한다.
    # dev 전용 호스트(dev.gamss.kr)를 두면 되지만 DNS·인증서·nginx 블록이 따로 필요해 미뤄둔다.
    base-url: https://gamss.kr/c

fcm:
  # Firebase 서비스 계정 JSON 을 base64 로 한 줄로 만든 값(배포는 GitHub 시크릿에서 주입).
  # 비워두면 푸시를 보내지 않는 구현이 선택된다 — 로컬·테스트는 자격증명 없이 기동해야 한다.
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.1-flash-lite
  request-timeout: PT15S
  # 모델별 토큰 요금(USD, 100만 토큰당, 글로벌 기준). Gemini는 요금 API가 없어 문서 기준으로 둔다
  # (2026-07, ai.google.dev/gemini-api/docs/pricing). 캐시 입력은 할인가, 출력은 캐시 안 됨.
  # 새 모델을 쓰면 항목만 추가하면 비용 계산이 자동 반영된다. 키에 점(.)이 있어 [ ] 로 감싼다.
  pricing:
    models:
      "[gemini-3.1-flash-lite]": { input-per1m: 0.25, cached-input-per1m: 0.025, output-per1m: 1.50 }
      "[gemini-3.5-flash-lite]": { input-per1m: 0.30, cached-input-per1m: 0.03, output-per1m: 2.50 }
      "[gemini-3.5-flash]": { input-per1m: 1.50, cached-input-per1m: 0.15, output-per1m: 9.00 }
      "[gemini-3.6-flash]": { input-per1m: 1.50, cached-input-per1m: 0.15, output-per1m: 7.50 }

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      # prometheus 는 모니터링 서버(gamss-monitor)가 15초마다 긁어가는 메트릭 엔드포인트다.
      # 공개 nginx(gamss.conf)는 /actuator 전체를 404로 막고, 사설망 전용 nginx 블록(9102)만
      # 이 경로를 프록시한다 — 노출 범위는 네트워크 계층에서 통제한다.
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # p95·p99 를 Prometheus 쪽(histogram_quantile)에서 계산하려면 버킷이 필요하다.
      # 앱이 미리 계산한 분위수는 인스턴스 간 합산이 불가능하고 시간 범위도 고정된다.
      percentiles-histogram:
        "[http.server.requests]": true
        "[gamss.llm.generation]": true
      # 버킷 상한. 기본 상한(30초)을 쓰면 LLM 생성(최대 120초)이 전부 +Inf 버킷에 몰려
      # 분위수가 상한값에 붙어버린다.
      maximum-expected-value:
        "[gamss.llm.generation]": 120s


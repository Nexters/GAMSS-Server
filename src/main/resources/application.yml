spring:
  application:
    name: gamss
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

# HTTPS 엣지(nginx) 뒤에서 X-Forwarded-Proto/Host 를 반영해 앱이 요청 스킴을 https 로 인식하게 한다.
# springdoc 이 문서·Try it out URL 을 http 가 아니라 https 로 생성하도록 하는 것이 목적.
# 앱 포트는 127.0.0.1 에만 바인딩돼 nginx만 접근하므로 이 헤더를 신뢰해도 안전하다(외부에서 위조 주입 불가).
server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_VALIDITY:PT1H}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:P14D}

firebase:
  # 소셜 로그인 검증 대상 Firebase 프로젝트. 비밀이 아니므로 설정값으로 둔다.
  project-id: gamss-cbdcb

admin:
  # 백오피스 접근 허용 이메일(쉼표 구분). 구글 로그인 후 이 목록에 있어야 관리자 토큰을 발급한다.
  emails: ${ADMIN_EMAILS:}

conversation:
  comment-pending-timeout: PT3M

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.1-flash-lite
  request-timeout: PT30S

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


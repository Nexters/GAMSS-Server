spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: test-secret-value-sufficiently-long-for-hs256-signing-0123456789abcdef
  access-token-validity: PT1H
  refresh-token-validity: P14D

firebase:
  project-id: gamss-test

conversation:
  comment-pending-timeout: PT3M

gemini:
  api-key: test-gemini-api-key-dummy-value
  model: gemini-3.1-flash-lite
  request-timeout: PT30S
  pricing:
    models:
      "[gemini-3.1-flash-lite]": { input-per1m: 0.25, cached-input-per1m: 0.025, output-per1m: 1.50 }
